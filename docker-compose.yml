version: '3.9'

services:
  # Laravel App (PHP-FPM)
  app:
    build:
      context: .
      dockerfile: Dockerfile  # Crie um Dockerfile simples (veja abaixo)
    container_name: autogest-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - app-network
    depends_on:
      - mysql
      - redis

  # Nginx (servidor web)
  nginx:
    image: nginx:alpine
    container_name: laravel-nginx
    restart: unless-stopped
    ports:
      - "80:80"          # Acesse o app em http://localhost
      # - "443:443"      # Se quiser HTTPS depois
    volumes:
      - .:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf  # Config custom (veja abaixo)
    networks:
      - app-network
    depends_on:
      - app

  # MySQL
  mysql:
    image: mysql:8.0
    container_name: laravel-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-saas_db}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_USER: ${DB_USERNAME:-laravel}
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3307:3306"  # Opcional: acessar do host com MySQL Workbench
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (para queue, cache, etc.)
  redis:
    image: redis:alpine
    container_name: laravel-redis
    restart: unless-stopped
    networks:
      - app-network

  # Kong API Gateway (modo DB-less / declarative)
  kong:
    image: kong:3.7   # ou latest, mas fixe versão em prod
    container_name: kong-gateway
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"                          # Modo DB-less
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_LOG_LEVEL: info
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    volumes:
      - ./kong:/kong/declarative:ro                # Monta sua config
    ports:
      - "8000:8000"     # Proxy (onde o frontend vai chamar)
      - "8443:8443"     # Proxy HTTPS (opcional)
      - "8001:8001"     # Admin API (para configurar via curl ou Konga)
      - "8444:8444"     # Admin HTTPS (opcional)
    networks:
      - app-network
    depends_on:
      - nginx

networks:
  app-network:
    driver: bridge

volumes:
  mysql-data:
